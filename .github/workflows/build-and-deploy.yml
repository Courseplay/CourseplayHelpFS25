name: build-and-deploy

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python with pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run documentation generation script
      - name: Generate markdown files from game XMLs
        run: python generate_from_xml.py --update

      # Step 5: Check for changes, commit and push if needed
      - name: Commit and push changes
        id: commit_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected in docs/. Committing..."
            git commit -m "Update generated markdown files"
            git push origin master
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # Step 6: Build and deploy to GitHub Pages (skip on cron schedule if nothing changed)
      - name: Build and deploy to GitHub Pages
        if: |
          github.event_name != 'schedule' || steps.commit_step.outputs.has_changes == 'true'
        run: mkdocs gh-deploy --force
